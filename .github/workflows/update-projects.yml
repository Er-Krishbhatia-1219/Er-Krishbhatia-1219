name: Update Profile Projects

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-projects:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate project list
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess

          owner = os.environ["OWNER"]

          result = subprocess.run(
              [
                  "gh", "repo", "list", owner,
                  "--limit", "100",
                  "--json",
                  "name,description,url,isFork,isArchived,primaryLanguage,pushedAt"
              ],
              capture_output=True,
              text=True,
              check=True
          )

          repos = json.loads(result.stdout)

          repos = [
              repo for repo in repos
              if repo["name"].lower() != owner.lower()
              and not repo["isFork"]
              and not repo["isArchived"]
          ]

          repos.sort(
              key=lambda x: x.get("pushedAt") or "",
              reverse=True
          )

          lines = []

          for repo in repos:
              name = repo["name"]
              description = repo.get("description") or "Project repository"
              url = repo["url"]

              language = repo.get("primaryLanguage")
              language_name = (
                  language["name"]
                  if language
                  else "Project"
              )

              lines.append(
                  f"### [{name}]({url})\n\n"
                  f"{description}\n\n"
                  f"`{language_name}`\n"
              )

          projects = "\n".join(lines)

          readme_path = "README.md"

          with open(readme_path, "r", encoding="utf-8") as f:
              readme = f.read()

          start_marker = "<!-- PROJECTS:START -->"
          end_marker = "<!-- PROJECTS:END -->"

          start = readme.index(start_marker) + len(start_marker)
          end = readme.index(end_marker)

          new_section = "\n\n" + projects + "\n"

          readme = (
              readme[:start]
              + new_section
              + readme[end:]
          )

          with open(readme_path, "w", encoding="utf-8") as f:
              f.write(readme)
          PY

      - name: Commit updated README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update project list"
            git push
          fi
